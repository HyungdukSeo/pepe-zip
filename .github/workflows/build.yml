name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            fetch: win32-x64 win32-arm64
            target: --win
          - os: macos-latest
            fetch: darwin-x64 darwin-arm64
            target: --mac
          - os: ubuntu-latest
            fetch: linux-x64 linux-arm64
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: node scripts/fetch-7zip.mjs ${{ matrix.fetch }}
      - run: node scripts/make-icon.mjs
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # 코드 서명 인증서가 없으면 서명 없이 빌드한다
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: pepe-zip-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
